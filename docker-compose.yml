
services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsync
      POSTGRES_PASSWORD: sportsync
      POSTGRES_DB: sportsync
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsync -d sportsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: harshvardhang7/sportsync-api:1.0
    container_name: sportsync-api
    restart: unless-stopped
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://sportsync:sportsync@postgres:5432/sportsync?schema=public
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:-dev-access-token-secret}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:-dev-refresh-token-secret}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: harshvardhang7/sportsync-web:1.0
    container_name: sportsync-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
