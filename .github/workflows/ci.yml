
name: SportSync CI

on:
  push:
    branches:
      - main
      - "ci/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sportsync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsync
          POSTGRES_PASSWORD: sportsync
          POSTGRES_DB: sportsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsync -d sportsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sportsync:sportsync@localhost:5432/sportsync?schema=public
      JWT_ACCESS_TOKEN_SECRET: ci-only-test-secret-not-for-production
      JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
      BCRYPT_SALT_ROUNDS: 12
      API_PORT: 4000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @sportsync/api exec prisma migrate deploy

      - name: Run lint
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Build application
        run: pnpm build
