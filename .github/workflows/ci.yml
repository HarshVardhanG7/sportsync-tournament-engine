
name: SportSync CI

on:
  push:
    branches:
      - main
      - "ci/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sportsync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsync
          POSTGRES_PASSWORD: sportsync
          POSTGRES_DB: sportsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsync -d sportsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sportsync:sportsync@localhost:5432/sportsync?schema=public
      JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
      JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
      BCRYPT_SALT_ROUNDS: 12
      API_PORT: 4000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @sportsync/api exec prisma migrate deploy

      - name: Run lint
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Build application
        run: pnpm build
  
  build-and-push:
    name: Build and Push Docker Images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'apps/api/**'
              - 'Dockerfile.api'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.dockerignore'

            web:
              - 'apps/web/**'
              - 'Dockerfile.web'
              - 'nginx/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.dockerignore'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate API image tags
        if: steps.filter.outputs.api == 'true'
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: harshvardhang7/sportsync-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push API image
        if: steps.filter.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Generate Web image tags
        if: steps.filter.outputs.web == 'true'
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: harshvardhang7/sportsync-web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Web image
        if: steps.filter.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
  deploy-to-minikube:
    name: Deploy to Minikube
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Verify Kubernetes connection
        shell: pwsh
        run: |
          $context = kubectl config current-context

          if ($context -ne "minikube") {
            throw "Expected Minikube context, but found: $context"
          }

          kubectl get nodes

      - name: Deploy API image
        shell: pwsh
        run: |
          kubectl set image deployment/api api=harshvardhang7/sportsync-api:sha-${{ github.sha }} -n sportsync
          kubectl rollout status deployment/api -n sportsync --timeout=180s

      - name: Deploy Web image
        shell: pwsh
        run: |
          kubectl set image deployment/web web=harshvardhang7/sportsync-web:sha-${{ github.sha }} -n sportsync
          kubectl rollout status deployment/web -n sportsync --timeout=180s

      - name: Verify deployments
        shell: pwsh
        run: |
          kubectl get deployments -n sportsync
          kubectl get pods -n sportsync -o wide
