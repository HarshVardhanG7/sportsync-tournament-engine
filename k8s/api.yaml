
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sportsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: harshvardhang7/sportsync-api:1.0
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
            - name: DATABASE_URL
              value: "postgresql://sportsync:sportsync@postgres:5432/sportsync?schema=public"
            - name: JWT_ACCESS_TOKEN_SECRET
              value: "dev-access-token-secret"
            - name: JWT_REFRESH_TOKEN_SECRET
              value: "dev-refresh-token-secret"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sportsync
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
